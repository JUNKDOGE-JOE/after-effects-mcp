name: RC Attestation

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  contracts:
    name: Validate release evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0

      - name: Run attestation contracts
        run: |
          node --test scripts/release/test/attestation.test.mjs
          node --test scripts/release/test/validate-attestation-comment.test.mjs
