name: Build direct release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: Validate candidate packaging contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the requested candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Select exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0

      - name: Run direct payload contracts
        run: |
          node --test scripts/package/test/verify-windows-zxp-stage.test.mjs
          node --test scripts/package/test/zxp-payload-audit.test.mjs
